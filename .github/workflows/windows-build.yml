# SubRec (字录) Windows build.
#
# Status: the application build and packaging steps have run successfully on GitHub.
# The build job also configures a separate test build dir (build/ci-tests) and runs the
# device-independent CTest set (label exactly "ci") right after the release app build,
# in the same job. A failing test fails the job and blocks the later Deploy, packaging
# and tag release steps.
#
# Installer addition: a third, tag-only release job creates reviewed draft assets.
# The following describes the original two build jobs.
# Two jobs:
#   ffmpeg (ubuntu-24.04)  builds SubRec's minimal FFmpeg n8.0.3 (+ x264, libvpl, nv-codec-headers,
#                          AMF headers; GPL-2.0-or-later, no version3, no nonfree) from pinned
#                          commits (packaging/ffmpeg/versions.env) by cross-compiling with
#                          MinGW-w64, then produces sources/ (corresponding source) with
#                          packaging/ffmpeg/collect-sources.sh. Output: FFMPEG_ROOT layout
#                          (bin/ include/ lib/ share/subrec-ffmpeg/ sources/).
#   build (windows-latest) builds SubRec against that FFMPEG_ROOT (Qt 6.8.0 + MinGW 13.1 + Ninja),
#                          deploys it and packages the DLLs, licenses and sources/ into the zip.
#                          The package carries the new-interface build (build/ci-new-ui,
#                          SUBREC_BUILD_NEW_UI=ON); the old-interface build (build/ci) is still
#                          built as a check but not packaged.
#
# - The new interface's icons (ui/icons/*.svg, iconfont.cn) have no resolved license; the
#   maintainers accepted that risk for pre-releases. See THIRD_PARTY_LICENSES.md §3 and §5.
# - ffmpeg.exe is NOT packaged: SubRec never starts it (it links the FFmpeg libraries). The Windows
#   job only runs it as a smoke test of the freshly built DLLs. See packaging/ffmpeg/README.md.
# - Artifacts are unsigned: Windows SmartScreen will warn ("More info" -> "Run anyway").
#   Verify the published SHA256 instead (see README).
name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.0'
  BUILD_TYPE: Release
  FFMPEG_ARTIFACT: ffmpeg-subrec-gpl-win64

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUBREC_FFMPEG_VARIANT: gpl
      # Release package: no test-only components (no native aac decoder, lavfi, wrapped_avframe...).
      # Local/PC2 test builds keep using the script default (1).
      SUBREC_FFMPEG_TEST_COMPONENTS: '0'
      SUBREC_FFMPEG_WORK: ${{ github.workspace }}/_ffbuild
    steps:
      - uses: actions/checkout@v4

      # The first real build used Debian 13 (GCC 14 mingw-w64 posix, NASM 2.16.03, CMake 3.31).
      # Ubuntu 24.04 ships older versions; the exact versions used are recorded in
      # sources/BUILD_CONFIG.txt of every build.
      - name: Install toolchain
        # apt: up to 4 attempts with Acquire::Retries. If azure.archive.ubuntu.com fails (DNS
        # outages seen on runners), apt-mirrors.txt and any sources naming it are switched to
        # archive.ubuntu.com / security.ubuntu.com before the next attempt.
        run: |
          set -o pipefail
          apt_log=$(mktemp)
          azure_err="^(Err|W|E):.*azure\.archive\.ubuntu\.com"
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=5 update 2>&1 | tee "$apt_log" \
              && ! grep -Eq "$azure_err" "$apt_log" \
              && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential git ca-certificates pkg-config nasm cmake ninja-build xz-utils \
            mingw-w64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev 2>&1 | tee -a "$apt_log"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::apt-get update/install failed after $attempt attempts"
              exit 1
            fi
            if grep -Eq "$azure_err" "$apt_log"; then
              echo "::warning::azure.archive.ubuntu.com failed; switching apt to archive.ubuntu.com / security.ubuntu.com"
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
                  | sudo tee /etc/apt/apt-mirrors.txt
              fi
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                if [ -f "$f" ] && grep -q 'azure\.archive\.ubuntu\.com' "$f"; then
                  sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"
                fi
              done
            fi
            sleep $((attempt * 15))
          done
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          dpkg-query -W gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm cmake

      - name: Build FFmpeg
        run: bash packaging/ffmpeg/build-ffmpeg.sh

      - name: Collect corresponding source
        run: |
          out="$SUBREC_FFMPEG_WORK/out/ffmpeg-subrec-$SUBREC_FFMPEG_VARIANT-win64"
          bash packaging/ffmpeg/collect-sources.sh "$out"
          (cd "$out/sources" && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FFMPEG_ARTIFACT }}
          path: ${{ github.workspace }}/_ffbuild/out/ffmpeg-subrec-gpl-win64/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: ffmpeg
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      stem: ${{ steps.package.outputs.stem }}
    env:
      # Build directory whose appSubRec.exe and POST_BUILD DLLs go into the package.
      SUBREC_PACKAGE_BUILD: build/ci-new-ui
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compute shared application and installer version
        id: ver
        run: python packaging/installer/package.py version

      - name: Test installer packaging helpers
        run: python packaging/installer/test_package.py -v

      - name: Check installer translation inputs
        shell: pwsh
        run: |
          foreach ($file in 'ChineseSimplified.isl', 'ChineseSimplified.LICENSE.txt') {
            if (-not (Test-Path "packaging/installer/$file")) {
              throw "Missing upstream $file; see packaging/installer/README.md. No fabricated translation or license is permitted."
            }
          }

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true

      - name: Add MinGW and Ninja to PATH
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download FFmpeg build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FFMPEG_ARTIFACT }}
          path: ffmpeg-root

      - name: Check FFmpeg build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path ffmpeg-root).Path
          foreach ($d in 'bin', 'include', 'lib', 'sources', 'share/subrec-ffmpeg/licenses') {
            if (-not (Test-Path (Join-Path $root $d))) { throw "FFmpeg artifact has no $d" }
          }
          "SUBREC_FFMPEG_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # Smoke test of the freshly built DLLs (ffmpeg.exe is not packaged).
          $ff = Join-Path $root 'bin/ffmpeg.exe'
          & $ff -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe -version failed' }
          $enc = (& $ff -hide_banner -encoders) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe -encoders failed' }
          foreach ($e in 'libx264', 'h264_nvenc', 'h264_amf', 'h264_qsv', 'aac') {
            if ($enc -notmatch "(?m)\s$e\s") { throw "encoder $e is missing from the FFmpeg build" }
          }
          # Screen backend filters (ddagrab itself cannot run on the GPU-less runner; PC2 tests it).
          $flt = (& $ff -hide_banner -filters) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe -filters failed' }
          foreach ($f in 'ddagrab', 'hwdownload', 'hwupload', 'hwmap', 'scale_d3d11') {
            if ($flt -notmatch "(?m)\s$f\s") { throw "filter $f is missing from the FFmpeg build" }
          }
          # Import libraries: SubRec's CMake files link ${FFMPEG_ROOT}/lib/<component>.lib.
          foreach ($c in 'avutil', 'avcodec', 'avformat', 'avfilter', 'avdevice', 'swscale', 'swresample') {
            if (-not (Test-Path (Join-Path $root "lib/$c.lib"))) { throw "lib/$c.lib is missing" }
            if (Test-Path (Join-Path $root "bin/$c.lib")) { throw "bin/$c.lib must have been moved to lib/" }
          }
          # The release FFmpeg is built with SUBREC_FFMPEG_TEST_COMPONENTS=0: it must NOT contain the
          # test-only native aac decoder.
          $dec = (& $ff -hide_banner -decoders) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe -decoders failed' }
          if ($dec -match "(?m)^\s*A\S*\s+aac\s") { throw 'release FFmpeg must not contain the aac decoder (SUBREC_FFMPEG_TEST_COMPONENTS=0)' }
          # Encode smoke test with lavfi generators only when the test components are present
          # (lavfi indev and wrapped_avframe decoder are test components).
          $devs = (& $ff -hide_banner -devices) -join "`n"
          if ($devs -match "(?m)\sD\S*\s+lavfi\s") {
            $smoke = Join-Path $env:RUNNER_TEMP 'smoke.mp4'
            & $ff -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x240:r=30:d=1' -f lavfi -i 'sine=d=1' -c:v libx264 -pix_fmt yuv420p -c:a aac $smoke
            if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe lavfi -> libx264/aac smoke encode failed' }
            if (-not (Test-Path $smoke) -or (Get-Item $smoke).Length -lt 1000) { throw 'smoke.mp4 is missing or too small' }
          } else {
            Write-Host 'lavfi not in this build (test components off): skipping the encode smoke test'
          }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DSUBREC_VERSION=${{ steps.ver.outputs.version }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DFFMPEG_ROOT="$env:SUBREC_FFMPEG_ROOT"
          -DSUBREC_BUILD_LIFECYCLE_TESTS=OFF
          -DSUBREC_STRIP_TEST_HOOKS=ON

      - name: Build
        run: cmake --build build/ci --target appSubRec --parallel

      - name: Configure tests
        shell: pwsh
        run: >
          cmake -S . -B build/ci-tests -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DSUBREC_VERSION=${{ steps.ver.outputs.version }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DFFMPEG_ROOT="$env:SUBREC_FFMPEG_ROOT"
          -DSUBREC_BUILD_LIFECYCLE_TESTS=ON

      - name: Build tests
        run: cmake --build build/ci-tests --target subrec_tests --parallel

      - name: Run device-independent tests
        timeout-minutes: 10
        # Release FFmpeg omits AAC decoding, lavfi and file fixture components.
        # PowerShell parser tests remain available to PC2's full test build.
        run: >
          ctest --test-dir build/ci-tests -L "^ci$"
          -LE "^(device|needs_ffmpeg_test_components|needs_powershell)$"
          --output-on-failure --timeout 180 --no-tests=error

      # Release configuration of the packaged build: same options as build/ci plus the new UI.
      - name: Configure new UI integration
        shell: pwsh
        run: >
          cmake -S . -B build/ci-new-ui -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DSUBREC_VERSION=${{ steps.ver.outputs.version }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DFFMPEG_ROOT="$env:SUBREC_FFMPEG_ROOT"
          -DSUBREC_BUILD_NEW_UI=ON
          -DSUBREC_BUILD_LIFECYCLE_TESTS=OFF
          -DSUBREC_STRIP_TEST_HOOKS=ON

      - name: Build new UI integration
        run: cmake --build build/ci-new-ui --target appSubRec --parallel

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = $env:SUBREC_PACKAGE_BUILD
          $out = "dist/SubRec"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$build/appSubRec.exe" $out/
          Copy-Item "$build/*.dll" $out/   # FFmpeg and MinGW runtime DLLs (copied by POST_BUILD)
          foreach ($d in 'libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll') {
            if (-not (Test-Path "$out/$d")) { throw "$d is missing from $build" }
          }
          # QML imports of both interfaces: ui/qml (new, the default; CaptionGlyph.qml imports
          # QtQuick.Shapes) and qml (old, still reachable with --old-ui).
          windeployqt --release --qmldir ui/qml --qmldir qml --no-translations "$out/appSubRec.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed ($LASTEXITCODE)" }
          foreach ($m in 'QtQuick', 'QtQuick/Controls', 'QtQuick/Controls/Basic', 'QtQuick/Controls/Material',
                         'QtQuick/Layouts', 'QtQuick/Window', 'QtQuick/Effects', 'QtQuick/Shapes',
                         'QtQuick/Dialogs', 'QtCore', 'Qt/labs/folderlistmodel') {
            if (-not (Test-Path "$out/qml/$m/qmldir")) { throw "QML module $m was not deployed" }
          }
          if (-not (Test-Path "$out/Qt6QuickShapes.dll")) { throw 'Qt6QuickShapes.dll was not deployed' }
          Copy-Item LICENSE $out/LICENSE.txt
          Copy-Item THIRD_PARTY_LICENSES.md $out/
          New-Item -ItemType Directory -Force "$out/licenses" | Out-Null
          Copy-Item "$env:SUBREC_FFMPEG_ROOT/share/subrec-ffmpeg/licenses" "$out/licenses/ffmpeg" -Recurse

      # Qt and MinGW-w64 runtime license material plus SOURCES.txt (THIRD_PARTY_LICENSES.md §7).
      # Legal texts are copied unmodified: GPL-3.0 / LGPL-3.0 from this repository (LICENSE,
      # LICENSES/LGPL-3.0.txt), Qt's SPDX SBOMs from the Qt kit, GCC / mingw-w64 / winpthreads
      # texts from the MinGW toolchain. Tag builds fail on a missing file; other builds get
      # licenses/INCOMPLETE-DO-NOT-DISTRIBUTE.txt.
      - name: Package license material
        shell: pwsh
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SUBREC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SUBREC_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist/SubRec'
          $problems = @()

          $qt = "$out/licenses/qt"
          New-Item -ItemType Directory -Force $qt | Out-Null
          Copy-Item packaging/licenses/qt/NOTICE.txt $qt/
          Copy-Item LICENSES/LGPL-3.0.txt $qt/
          Copy-Item LICENSE "$qt/GPL-3.0.txt"
          $sbom = @(Get-ChildItem (Join-Path $env:QT_ROOT_DIR 'sbom') -Filter '*.spdx' -File -ErrorAction SilentlyContinue)
          if ($sbom.Count -gt 0) {
            New-Item -ItemType Directory -Force "$qt/sbom" | Out-Null
            $sbom | Copy-Item -Destination "$qt/sbom"
          } else {
            $problems += "no Qt SBOM (*.spdx) under $env:QT_ROOT_DIR/sbom"
          }

          $rt = "$out/licenses/mingw-runtime"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Copy-Item packaging/licenses/mingw-runtime/NOTICE.txt $rt/
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64'
          foreach ($d in 'gcc', 'mingw-w64', 'winpthreads') {
            $s = Join-Path $mingw "licenses/$d"
            if (Test-Path $s) { Copy-Item $s "$rt/$d" -Recurse } else { $problems += "MinGW toolchain has no licenses/$d" }
          }
          foreach ($f in 'gcc/COPYING3', 'gcc/COPYING.RUNTIME', 'winpthreads/COPYING') {
            if (-not (Test-Path "$rt/$f")) { $problems += "licenses/mingw-runtime/$f is missing" }
          }
          $info = Join-Path $mingw 'build-info.txt'
          if (Test-Path $info) { Copy-Item $info "$rt/toolchain-build-info.txt" } else { $problems += 'MinGW toolchain has no build-info.txt' }

          Copy-Item packaging/licenses/SOURCES.txt "$out/SOURCES.txt"
          Add-Content "$out/SOURCES.txt" "Repository: $env:SUBREC_REPO_URL", "Commit    : $env:SUBREC_COMMIT", "Qt        : $env:QT_VERSION MinGW 64-bit (win64_mingw)"

          if ($problems.Count -gt 0) {
            $msg = "License material is incomplete:`n - " + ($problems -join "`n - ")
            if ($env:IS_RELEASE -eq 'true') { throw $msg }
            Write-Warning $msg
            [IO.File]::WriteAllText("$out/licenses/INCOMPLETE-DO-NOT-DISTRIBUTE.txt", $msg + "`n")
          }
          Get-ChildItem "$out/licenses" -Recurse -File | Select-Object FullName, Length

      # GPL: the package ships FFmpeg DLLs with x264 linked in (GPL-2.0-or-later), so it must carry
      # the corresponding source: <package>/sources/ is the output of collect-sources.sh from the
      # ffmpeg job (git archive of each pinned commit, build scripts, BUILD_CONFIG.txt, SHA256SUMS).
      # This step re-checks the artifact. Tag builds fail on any problem; other builds get
      # sources/INCOMPLETE-DO-NOT-DISTRIBUTE.txt.
      - name: Package corresponding source (GPL)
        shell: pwsh
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "dist/SubRec/sources"
          Copy-Item "$env:SUBREC_FFMPEG_ROOT/sources" $src -Recurse
          $srcFull = (Resolve-Path $src).Path
          $problems = @()

          $sums = Join-Path $srcFull 'SHA256SUMS'
          if (-not (Test-Path $sums)) {
            $problems += 'sources/SHA256SUMS is missing'
          } else {
            $listed = @()
            foreach ($line in Get-Content $sums) {
              if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') { $problems += "bad SHA256SUMS line: $line"; continue }
              $hash = $Matches[1]; $name = $Matches[2]
              $listed += $name
              $f = Join-Path $srcFull $name
              if (-not (Test-Path $f)) {
                $problems += "listed file is missing: $name"
              } elseif ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $hash) {
                $problems += "SHA256 mismatch: $name"
              }
            }
            foreach ($f in Get-ChildItem $srcFull -File | Where-Object { $_.Name -ne 'SHA256SUMS' }) {
              if ($listed -notcontains $f.Name) { $problems += "not listed in SHA256SUMS: $($f.Name)" }
            }
            foreach ($pattern in 'ffmpeg-*.tar.xz', 'x264-*.tar.xz', 'libvpl-*.tar.xz', 'nv-codec-headers-*.tar.xz', 'amf-headers-*.tar.xz', 'subrec-ffmpeg-build-scripts.tar.xz', 'BUILD_CONFIG.txt') {
              if (-not ($listed | Where-Object { $_ -like $pattern })) { $problems += "no $pattern in sources/" }
            }
          }

          $cfgFile = Join-Path $srcFull 'BUILD_CONFIG.txt'
          if (Test-Path $cfgFile) {
            $cfg = Get-Content $cfgFile -Raw
            if ($cfg -match 'TODO') { $problems += 'BUILD_CONFIG.txt contains TODO' }
            if ($cfg -notmatch '(?m)^Variant\s*:\s*gpl\s*$') { $problems += 'BUILD_CONFIG.txt is not the gpl variant' }
          }

          # The DLLs in the package must be the ones recorded in BUILD_CONFIG.txt (ffmpeg.exe is not
          # shipped) and the ones POST_BUILD copied into the packaged build ($env:SUBREC_PACKAGE_BUILD).
          $recorded = Join-Path $env:SUBREC_FFMPEG_ROOT 'share/subrec-ffmpeg/binaries.sha256'
          $nDll = 0
          foreach ($line in Get-Content $recorded) {
            if ($line -notmatch '^([0-9a-f]{64})  \./(\S+\.dll)$') { continue }
            $nDll++
            $hash = $Matches[1]; $name = $Matches[2]
            $f = Join-Path 'dist/SubRec' $name
            $b = Join-Path $env:SUBREC_PACKAGE_BUILD $name
            if (-not (Test-Path $f)) {
              $problems += "$name is not in the package"
            } elseif ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              $problems += "$name differs from the build recorded in BUILD_CONFIG.txt"
            } elseif (-not (Test-Path $b) -or (Get-FileHash $b -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              $problems += "$name in the package is not the one in $env:SUBREC_PACKAGE_BUILD"
            }
          }
          if ($nDll -ne 7) { $problems += "expected 7 FFmpeg DLLs in binaries.sha256, found $nDll" }
          if (Test-Path 'dist/SubRec/ffmpeg.exe') { $problems += 'ffmpeg.exe must not be packaged' }

          if ($problems.Count -gt 0) {
            $msg = "Corresponding source is incomplete or inconsistent:`n - " + ($problems -join "`n - ")
            if ($env:IS_RELEASE -eq 'true') { throw $msg }
            Write-Warning $msg
            [IO.File]::WriteAllText("$srcFull/INCOMPLETE-DO-NOT-DISTRIBUTE.txt", $msg + "`n")
          }
          Get-ChildItem $srcFull | Select-Object Name, Length

      - name: Install pinned Inno Setup
        shell: pwsh
        # Historical implementation notes below (superseded by coordinator verification on 2026-11-12):
        # 6.4.3 is a candidate pin, NOT verified online in the implementation sandbox.
        # Verify the package and license before enabling this workflow; see installer README.
        # Current fixed Inno 6 version: 6.7.1, verified at the Chocolatey package page.
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade --force -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey failed: $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Pinned ISCC.exe not found' }
          $version = (Get-Item $iscc).VersionInfo.ProductVersion
          if ($version -notmatch '^6\.7\.1(?:\.0)?$') { throw "Unexpected Inno compiler: $version" }

      - name: Prepare installer payload and upgrade cleanup
        id: package
        shell: pwsh
        env:
          ASSET_STEM: ${{ steps.ver.outputs.stem }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          python packaging/installer/package.py prepare --compiler "$compiler" --stem "$env:ASSET_STEM"
          if ($LASTEXITCODE -ne 0) { throw 'Installer preparation failed' }

      - name: Build unsigned installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_VERSION_NUMERIC: ${{ steps.ver.outputs.numeric }}
          ASSET_STEM: ${{ steps.package.outputs.stem }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc /Qp "/DAppVersion=$env:APP_VERSION" "/DAppVersionNumeric=$env:APP_VERSION_NUMERIC" `
            "/DSourceDir=$((Resolve-Path dist/SubRec).Path)" "/DOutputName=$env:ASSET_STEM-win64-setup" `
            "/DRepoURL=$env:REPO_URL" packaging/installer/SubRec.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Installer smoke test (install, upgrade, uninstall)
        timeout-minutes: 10
        shell: pwsh
        env:
          ASSET_STEM: ${{ steps.package.outputs.stem }}
        run: ./packaging/installer/smoke-test.ps1 -Setup "out/$env:ASSET_STEM-win64-setup.exe"

      - name: Preserve installer test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SubRec-installer-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Portable zip, corresponding source and SHA256SUMS
        shell: pwsh
        env:
          ASSET_STEM: ${{ steps.package.outputs.stem }}
        run: python packaging/installer/package.py bundle --stem "$env:ASSET_STEM"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.stem }}-win64
          path: out/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used to create a draft release on tags
    concurrency:
      group: installer-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      STEM: ${{ needs.build.outputs.stem }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.stem }}-win64
          path: out
      - name: Verify exact asset set, checksums and release eligibility
        run: |
          set -euo pipefail
          python packaging/installer/package.py version
          test "$STEM" = "SubRec-$TAG"
          python packaging/installer/package.py verify --stem "$STEM"
      - name: Create draft prerelease (fail if draft or published release exists)
        working-directory: out
        run: |
          set -euo pipefail
          # Listing releases includes drafts for an authenticated writer. An API error
          # must fail; it must never be treated as evidence that a release is absent.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/subrec-release-tags.txt"
          if grep -Fxq -- "$TAG" "$RUNNER_TEMP/subrec-release-tags.txt"; then
            echo "::error::Release already exists. CI will not append, overwrite or delete it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/subrec-release-notes.md" <<'NOTES'
          Draft prerelease created by CI; maintainer review and Windows acceptance are required before publishing.
          Unsigned application, setup and uninstaller. Verify downloads against SHA256SUMS.txt. Windows may warn or block execution.
          The setup and portable zip include licenses/ and mandatory sources/ (FFmpeg/x264 corresponding source); a separate source zip is attached.
          New UI icons come from iconfont.cn; their license remains unresolved. Maintainer-accepted risk permits pre-releases only.
          The application icon was generated by gpt-image-2.5 via the maintainer's CLIProxyAPI on 2026-11-12; its copyright status may be unclear. See NOTICE.txt for the exact prompt.
          未签名预发布草稿：维护者完成 Windows 验收、核对 SHA256SUMS.txt 与许可/源码材料后才能发布。图标许可仍未解决。
          NOTES
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "SubRec $TAG" --notes-file "$RUNNER_TEMP/subrec-release-notes.md" \
            "$STEM-win64-setup.exe" "$STEM-win64-portable.zip" \
            "$STEM-ffmpeg-corresponding-source.zip" SHA256SUMS.txt
