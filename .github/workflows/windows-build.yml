# SubRec (字录) Windows build.
#
# Status: written for the new repository <OWNER>/SubRec; NOT yet run. Verify on a first
# push / workflow_dispatch and adjust (Qt arch, MinGW tool name, FFmpeg archive layout).
#
# - Toolchain: Qt 6.8.0 + MinGW 13.1 (the toolchain the project is developed with) + Ninja.
# - FFmpeg is not stored in this repository. Set the repository variable FFMPEG_URL to a
#   shared FFmpeg build zip (with include/, lib/, bin/); optionally FFMPEG_SHA256 to verify it.
#   The FFmpeg build must be a GPL-compatible build for a GPL-3.0 release; see THIRD_PARTY_LICENSES.md.
# - Artifacts are unsigned: Windows SmartScreen will warn ("More info" -> "Run anyway").
#   Verify the published SHA256 instead (see README).
name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.0'
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to create a draft release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true

      - name: Add MinGW and Ninja to PATH
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch FFmpeg
        shell: pwsh
        env:
          FFMPEG_URL: ${{ vars.FFMPEG_URL }}
          FFMPEG_SHA256: ${{ vars.FFMPEG_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FFMPEG_URL)) {
            throw "Repository variable FFMPEG_URL is not set. Set it to the URL of a shared FFmpeg build zip (with include/, lib/, bin/). See README.md (Building)."
          }
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          if (-not [string]::IsNullOrWhiteSpace($env:FFMPEG_SHA256)) {
            $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
            if ($actual -ne $env:FFMPEG_SHA256.ToUpper()) { throw "FFmpeg archive SHA256 mismatch" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $root = (Get-ChildItem ffmpeg_dl -Directory | Select-Object -First 1).FullName
          "SUBREC_FFMPEG_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DFFMPEG_ROOT="$env:SUBREC_FFMPEG_ROOT"
          -DSUBREC_BUILD_LIFECYCLE_TESTS=OFF

      - name: Build
        run: cmake --build build/ci --target appSubRec --parallel

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          $out = "dist/SubRec"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/ci/appSubRec.exe $out/
          Copy-Item build/ci/*.dll $out/ -ErrorAction SilentlyContinue   # FFmpeg and MinGW runtime DLLs (copied by POST_BUILD)
          windeployqt --release --qmldir qml --no-translations "$out/appSubRec.exe"
          Copy-Item LICENSE $out/LICENSE.txt
          Copy-Item THIRD_PARTY_LICENSES.md $out/
          Copy-Item "$env:SUBREC_FFMPEG_ROOT/LICENSE.txt" $out/FFmpeg-LICENSE.txt -ErrorAction SilentlyContinue

      # GPL: the package ships FFmpeg DLLs built with --enable-gpl, so it must carry the
      # corresponding source. Layout of <package>/sources/ (see THIRD_PARTY_LICENSES.md):
      #   ffmpeg-37064b2d16.tar.gz, x265-f8be4634.tar.gz, x264-<X264_COMMIT>.tar.gz, BUILD_CONFIG.txt, SHA256SUMS
      # Pinned here: FFmpeg commit and x265 commit (both read from the DLL version strings).
      # The three archive URLs were verified externally on 2026-10-26 (FFmpeg 16,174,649 B,
      # x265 1,749,268 B, x264 1,040,327 B). Override x265 with the repository variable X265_SOURCE_URL.
      # x264: the DLLs only say "core 165". Default is stable-branch commit b35605ace3ddf7c1a5d67a2eb553f034aef41d55
      # (x264.h has X264_BUILD 165; checked by this step). It is NOT proven to be the revision that
      # was actually built, so the bundled source may not be byte-identical. Override with the
      # repository variable X264_COMMIT.
      # Still unknown, so it blocks tagged releases (other builds get INCOMPLETE-DO-NOT-DISTRIBUTE.txt):
      #   - the TODO items left in packaging/BUILD_CONFIG.txt (other statically linked libraries, build scripts).
      - name: Collect corresponding source (GPL)
        shell: pwsh
        env:
          FFMPEG_COMMIT: '37064b2d16'
          X265_COMMIT: 'f8be4634'
          X265_SOURCE_URL: ${{ vars.X265_SOURCE_URL }}
          X264_COMMIT_OVERRIDE: ${{ vars.X264_COMMIT }}
          X264_COMMIT_DEFAULT: 'b35605ace3ddf7c1a5d67a2eb553f034aef41d55'
          X264_BUILD_EXPECTED: '165'
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "dist/SubRec/sources"
          New-Item -ItemType Directory -Force $src | Out-Null
          $srcFull = (Resolve-Path $src).Path
          $problems = @()

          Invoke-WebRequest "https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/$env:FFMPEG_COMMIT" -OutFile "$srcFull/ffmpeg-$env:FFMPEG_COMMIT.tar.gz"

          $x265Url = $env:X265_SOURCE_URL
          if ([string]::IsNullOrWhiteSpace($x265Url)) { $x265Url = "https://bitbucket.org/multicoreware/x265_git/get/$env:X265_COMMIT.tar.gz" }
          Invoke-WebRequest $x265Url -OutFile "$srcFull/x265-$env:X265_COMMIT.tar.gz"

          $x264Commit = $env:X264_COMMIT_OVERRIDE
          if ([string]::IsNullOrWhiteSpace($x264Commit)) { $x264Commit = $env:X264_COMMIT_DEFAULT }
          if ($x264Commit -notmatch '^[0-9a-f]{7,40}$') {
            $problems += 'X264_COMMIT must be a hexadecimal commit id'
          } else {
            $x264File = "$srcFull/x264-$x264Commit.tar.gz"
            Invoke-WebRequest "https://code.videolan.org/videolan/x264/-/archive/$x264Commit/x264-$x264Commit.tar.gz" -OutFile $x264File
            $hdr = (& "$env:SystemRoot\System32\tar.exe" -xOf $x264File '*/x264.h') -join "`n"
            if ($LASTEXITCODE -ne 0 -or $hdr -notmatch "#define\s+X264_BUILD\s+$env:X264_BUILD_EXPECTED\b") {
              $problems += "x264 archive for $x264Commit does not define X264_BUILD $env:X264_BUILD_EXPECTED (the DLLs report core $env:X264_BUILD_EXPECTED)"
            }
          }

          $cfg = Get-Content packaging/BUILD_CONFIG.txt -Raw
          if ($cfg -match 'TODO') { $problems += 'packaging/BUILD_CONFIG.txt still has TODO items (other statically linked libraries, build scripts)' }
          $ffexe = Join-Path $env:SUBREC_FFMPEG_ROOT 'bin/ffmpeg.exe'
          $banner = 'ffmpeg.exe not found in the FFmpeg package; no -version output captured.'
          if (Test-Path $ffexe) { $banner = (& $ffexe -hide_banner -version) -join "`n" }
          [IO.File]::WriteAllText("$srcFull/BUILD_CONFIG.txt", $cfg + "`n`n--- ffmpeg -version (captured by CI from the packaged build) ---`n" + $banner + "`n", (New-Object Text.UTF8Encoding($false)))

          if ($problems.Count -gt 0) {
            $msg = "Corresponding source is incomplete:`n - " + ($problems -join "`n - ")
            if ($env:IS_RELEASE -eq 'true') { throw $msg }
            Write-Warning $msg
            [IO.File]::WriteAllText("$srcFull/INCOMPLETE-DO-NOT-DISTRIBUTE.txt", $msg + "`n")
          }

          $lines = Get-ChildItem $srcFull -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          }
          [IO.File]::WriteAllText("$srcFull/SHA256SUMS", ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem $srcFull | Select-Object Name, Length

      - name: Zip and SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SubRec/* -DestinationPath SubRec-win64.zip
          $hash = (Get-FileHash SubRec-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SubRec-win64.zip" | Out-File SubRec-win64.zip.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: SubRec-win64
          path: |
            SubRec-win64.zip
            SubRec-win64.zip.sha256
          retention-days: 14

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SubRec-win64.zip
            SubRec-win64.zip.sha256
          body: |
            Unsigned build. Windows SmartScreen may warn on first run: click "More info" -> "Run anyway", and verify the SHA256 of the zip against the attached .sha256 file.
            未签名构建。首次运行 Windows SmartScreen 可能提示，点“更多信息”→“仍要运行”，并用附带的 .sha256 校验 zip。

            The zip contains the GPL corresponding source of the bundled FFmpeg/x264/x265 in `sources/` (checksums in `sources/SHA256SUMS`).
            压缩包的 `sources/` 目录内含所附 FFmpeg/x264/x265 的 GPL 对应源码（校验值见 `sources/SHA256SUMS`）。
          draft: true
