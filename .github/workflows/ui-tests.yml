name: ui-tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # apt: up to 4 attempts with Acquire::Retries. If azure.archive.ubuntu.com fails (DNS
        # outages seen on runners), apt-mirrors.txt and any sources naming it are switched to
        # archive.ubuntu.com / security.ubuntu.com before the next attempt.
        run: |
          set -o pipefail
          apt_log=$(mktemp)
          azure_err="^(Err|W|E):.*azure\.archive\.ubuntu\.com"
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=5 update 2>&1 | tee "$apt_log" \
              && ! grep -Eq "$azure_err" "$apt_log" \
              && sudo apt-get -o Acquire::Retries=5 install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev 2>&1 | tee -a "$apt_log"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::apt-get update/install failed after $attempt attempts"
              exit 1
            fi
            if grep -Eq "$azure_err" "$apt_log"; then
              echo "::warning::azure.archive.ubuntu.com failed; switching apt to archive.ubuntu.com / security.ubuntu.com"
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
                  | sudo tee /etc/apt/apt-mirrors.txt
              fi
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                if [ -f "$f" ] && grep -q 'azure\.archive\.ubuntu\.com' "$f"; then
                  sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"
                fi
              done
            fi
            sleep $((attempt * 15))
          done
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
      - name: Configure
        run: cmake -S tests/ui -B build-ui -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Build
        id: build
        run: cmake --build build-ui --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: ctest --test-dir build-ui --output-on-failure --no-tests=error
      # Per-test QtTest logs (tests/ui -o files); uploaded whether or not the tests passed.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs-linux
          path: build-ui/test-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: QML lint
        # After a test failure too, so lint results are not lost; never on a failed or
        # skipped build (no half-built tree) or a cancelled run. Failed tests still fail the job.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -eo pipefail
          cmake --build build-ui --target all_qmllint 2>&1 | tee /tmp/ui-qmllint.log
          bash tools/ci/check_qmllint_log.sh /tmp/ui-qmllint.log

  # Same standalone tests/ui build on Windows (Qt 6.8.0 + MinGW 13.1 + Ninja, installed the
  # same way as windows-build.yml). No FFmpeg, no deploy/package/release. Exercises the
  # WIN32-only code paths (H2 global hotkeys, TB1 taskbar overlay, capture exclusion, power
  # request) and the WIN32 link lines of tests/ui/CMakeLists.txt.
  ui-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
      - name: Add MinGW and Ninja to PATH
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure
        shell: pwsh
        # -Werror as on Linux. Not yet run on MinGW: if MinGW-only warnings show up in the
        # WIN32 branches, fix them rather than dropping -Werror.
        run: >
          cmake -S tests/ui -B build-ui -G Ninja
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Build
        id: build
        run: cmake --build build-ui --parallel 2
      - name: Test
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: ctest --test-dir build-ui --output-on-failure --no-tests=error
      # QtTest console output did not reach ctest on this runner; the -o files do.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs-windows
          path: build-ui/test-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: QML lint
        # After a test failure too, so lint results are not lost; never on a failed or
        # skipped build (no half-built tree) or a cancelled run. Failed tests still fail the job.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Git Bash; same gate script as Linux (grep only, no rg).
        shell: bash
        run: |
          set -eo pipefail
          cmake --build build-ui --target all_qmllint 2>&1 | tee build-ui/ui-qmllint.log
          bash tools/ci/check_qmllint_log.sh build-ui/ui-qmllint.log
